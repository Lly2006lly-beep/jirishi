{% extends "base.html" %}
{% block title %}注册 - 今日事{% endblock %}

{% block content %}
<div class="auth-container">
    <div class="auth-card">
        <div class="auth-header">
            <h1>📋 今日事</h1>
            <p class="auth-subtitle">创建新账户，开始记录每一天</p>
        </div>

        <form method="POST" action="{{ url_for('register') }}" class="auth-form">
            <div class="form-group">
                <label for="username">用户名</label>
                <input type="text" id="username" name="username"
                       placeholder="2-20位字母、数字或中文" required
                       autocomplete="username" autofocus
                       minlength="2" maxlength="20">
            </div>

            <div class="form-group">
                <label for="password">密码</label>
                <input type="password" id="password" name="password"
                       placeholder="至少6位密码" required
                       autocomplete="new-password" minlength="6">
            </div>

            <div class="form-group">
                <label for="password2">确认密码</label>
                <input type="password" id="password2" name="password2"
                       placeholder="再次输入密码" required
                       autocomplete="new-password" minlength="6">
            </div>

            <button type="submit" class="btn btn-primary btn-full">注 册</button>
        </form>

        <div class="auth-footer">
            已有账户？
            <a href="{{ url_for('login') }}">立即登录</a>
        </div>
    </div>
</div>
{% endblock %}
