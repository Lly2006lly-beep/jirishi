{% extends "base.html" %}
{% block title %}登录 - 今日事{% endblock %}

{% block content %}
<div class="auth-container">
    <div class="auth-card">
        <div class="auth-header">
            <h1>📋 今日事</h1>
            <p class="auth-subtitle">登录你的账户</p>
        </div>

        <form method="POST" action="{{ url_for('login') }}" class="auth-form">
            <div class="form-group">
                <label for="username">用户名</label>
                <input type="text" id="username" name="username"
                       placeholder="请输入用户名" required autocomplete="username"
                       autofocus>
            </div>

            <div class="form-group">
                <label for="password">密码</label>
                <input type="password" id="password" name="password"
                       placeholder="请输入密码" required autocomplete="current-password">
            </div>

            <button type="submit" class="btn btn-primary btn-full">登 录</button>
        </form>

        <div class="auth-footer">
            还没有账户？
            <a href="{{ url_for('register') }}">立即注册</a>
        </div>
    </div>
</div>
{% endblock %}
